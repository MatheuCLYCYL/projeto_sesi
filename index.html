<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetria - Velocímetro IoT</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-gauges@2.1.7/gauge.min.js"></script>
    <style>
        body {
            background-color: #0e1013;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .painel-container {
            background: linear-gradient(145deg, #1a1d24, #111318);
            border: 4px solid #2c313c;
            border-radius: 50px;
            padding: 30px 50px;
            display: flex;
            align-items: center;
            gap: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
        }

        .gauge-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status {
            margin-top: 25px;
            font-size: 1.2rem;
            background-color: #161a22;
            padding: 8px 25px;
            border-radius: 20px;
            border: 1px solid #232936;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="painel-container">
        <div class="gauge-box">
            <canvas id="gauge-velocidade"></canvas>
        </div>

        <div class="gauge-box">
            <canvas id="gauge-rpm"></canvas>
        </div>
    </div>

    <div id="status">Buscando dados da telemetria...</div>

    <script>
        // Configuração do Velocímetro de KM/H
        var gaugeVelocidade = new RadialGauge({
            renderTo: 'gauge-velocidade',
            width: 320,
            height: 320,
            units: 'KM/H',
            title: 'TELEMETRIA',
            minValue: 0,
            maxValue: 240,
            majorTicks: ['0','20','40','60','80','100','120','140','160','180','200','220','240'],
            minorTicks: 2,
            strokeTicks: true,
            highlights: [{ from: 180, to: 240, color: 'rgba(200, 50, 50, .75)' }],
            colorPlate: '#1c2028',
            colorMajorTicks: '#f5f5f5',
            colorMinorTicks: '#ddd',
            colorTitle: '#fff',
            colorUnits: '#00ff66',
            colorNumbers: '#fff',
            colorNeedle: '#00ff66',
            colorNeedleEnd: '#00ff66',
            valueBox: true,
            fontValueSize: 45,
            colorValueBoxRect: '#13161c',
            colorValueBoxBackground: '#13161c',
            colorValueText: '#00ff66',
            borderShadowWidth: 0,
            borders: true,
            borderInnerWidth: 0,
            borderMiddleWidth: 0,
            borderOuterWidth: 10,
            colorBorderOuter: '#2c313c',
            needleType: 'arrow',
            needleWidth: 3,
            animationDuration: 500,
            animationRule: 'linear'
        }).draw();

        // Configuração do Conta-Giros de RPM
        var gaugeRpm = new RadialGauge({
            renderTo: 'gauge-rpm',
            width: 260,
            height: 260,
            units: 'RPM',
            title: '×1000',
            minValue: 0,
            maxValue: 8,
            majorTicks: ['0','1','2','3','4','5','6','7','8'],
            minorTicks: 5,
            strokeTicks: true,
            highlights: [{ from: 6, to: 8, color: 'rgba(200, 50, 50, .75)' }],
            colorPlate: '#1c2028',
            colorMajorTicks: '#f5f5f5',
            colorMinorTicks: '#ddd',
            colorTitle: '#aaa',
            colorUnits: '#00ff66',
            colorNumbers: '#fff',
            colorNeedle: '#00ff66',
            colorNeedleEnd: '#00ff66',
            valueBox: true,
            fontValueSize: 40,
            colorValueBoxRect: '#13161c',
            colorValueBoxBackground: '#13161c',
            colorValueText: '#00ff66',
            borderShadowWidth: 0,
            borders: true,
            borderInnerWidth: 0,
            borderMiddleWidth: 0,
            borderOuterWidth: 8,
            colorBorderOuter: '#2c313c',
            needleType: 'arrow',
            needleWidth: 3,
            animationDuration: 500,
            animationRule: 'linear'
        }).draw();

        // Função para buscar os dados do seu arquivo PHP automático
        async function atualizarPainel() {
            try {
                const resposta = await fetch('buscar_ultimo.php');
                const dados = await resposta.json();
                
                if(dados && !dados.erro) {
                    // Atualiza os ponteiros e as caixas digitais dos ponteiros
                    gaugeVelocidade.value = parseFloat(dados.velocidade).toFixed(1);
                    
                    // Converte o RPM bruto (ex: 3000) para escala de painel de carro (ex: 3.0)
                    let rpmEscala = (parseFloat(dados.rpm) / 1000).toFixed(2);
                    gaugeRpm.value = rpmEscala;
                    
                    document.getElementById('status').innerText = "Conectado ao ESP32";
                    document.getElementById('status').style.color = "#00ff66";
                }
            } catch (erro) {
                document.getElementById('status').innerText = "Aguardando novos dados...";
                document.getElementById('status').style.color = "#ff9900";
            }
        }

        // Fica rodando em loop a cada meio segundo (500 milissegundos) igual o seu antigo
        setInterval(atualizarPainel, 500);
    </script>
</body>
</html>
